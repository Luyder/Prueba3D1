<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión — Diferenciales y faltantes de la Facultad de Educación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBFAF6;
  --panel: #FFFFFF;
  --ink: #17160F;
  --ink-soft: #55534A;
  --ink-faint: #8A877A;
  --rule: #E7E4D8;
  --accent: #00BF63;
  --accent-deep: #067A40;
  --accent-wash: #DEF7E9;
  --green: #2F7A52;
  --green-wash: #E7F3EC;
  --sans: "Poppins", "Segoe UI", system-ui, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

.topbar { display: flex; align-items: center; gap: 1.1rem; padding: .8rem 1.3rem; border-bottom: 1px solid var(--rule); background: var(--panel); flex-wrap: wrap; }
.topbar h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.tabs { display: flex; gap: .3rem; margin-left: .5rem; }
.tab { font-family: var(--sans); font-size: 12.5px; font-weight: 500; color: var(--ink-soft); background: none; border: 1px solid transparent; border-radius: 7px; padding: .4rem .75rem; cursor: pointer; }
.tab:hover { background: var(--accent-wash); }
.tab.active { background: var(--ink); color: #F7F5EC; }
.progress { margin-left: auto; display: flex; align-items: center; gap: .6rem; font-size: 12px; color: var(--ink-faint); }
.progress-bar { width: 120px; height: 6px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.progress-bar > div { height: 100%; background: var(--green); width: 0%; transition: width .2s ease; }
.pdf-btn {
  display: inline-flex; align-items: center; gap: .4rem; font-family: var(--sans); font-size: 12.5px; font-weight: 500;
  color: var(--ink); background: var(--accent-wash); border: 1px solid #A7E7C4; border-radius: 7px;
  padding: .45rem .8rem; cursor: pointer; white-space: nowrap;
}
.pdf-btn:hover { background: var(--accent); }

.view { display: none; height: 100%; min-height: 0; overflow-y: auto; }
.view.active { display: block; }

/* ---------- map view ---------- */
#view-map { padding: 2rem 3rem 6rem; }
.map-head { max-width: 74rem; margin: 0 auto 1.6rem; }
.map-head p.intro { font-family: var(--serif); font-size: 16px; color: var(--ink-soft); max-width: 42rem; margin: 0 0 1.1rem; }
.map-controls { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.search { font-family: var(--sans); font-size: 13px; padding: .55rem .8rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--ink); width: 240px; }
.search:focus { outline: none; border-color: var(--accent-deep); }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; }
.chip { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-soft); background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: .3rem .65rem; cursor: pointer; }
.chip:hover { border-color: var(--accent-deep); }
.chip.on { background: var(--ink); color: #F7F5EC; border-color: var(--ink); }
.chip-clear { font-size: 11.5px; color: var(--ink-faint); background: none; border: none; cursor: pointer; text-decoration: underline; }

.map-wrap { max-width: 74rem; width: 100%; margin: 0 auto; }
.map-wrap h2 { font-family: var(--sans); font-size: 1.15rem; font-weight: 600; margin: 2.2rem 0 1rem; }
.map-wrap h2:first-child { margin-top: 0; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .7rem; }
.map-card {
  text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  padding: .8rem .9rem; font-family: var(--sans); display: flex; flex-direction: column; gap: .5rem;
  transition: border-color .12s ease, box-shadow .12s ease;
}
.map-card:hover { border-color: var(--accent-deep); box-shadow: 0 2px 10px rgba(23,22,15,.06); }
.map-card.done { background: var(--green-wash); border-color: #BFE0CD; }
.map-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
.map-card-num { font-size: 11px; color: var(--ink-faint); font-weight: 600; }
.map-card-check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--rule); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; flex-shrink: 0; }
.map-card.done .map-card-check { background: var(--green); border-color: var(--green); }
.map-card-title { font-size: 13px; line-height: 1.35; color: var(--ink); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.map-card-dots { display: flex; gap: 2px; flex-wrap: wrap; }
.map-card-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); opacity: .5; }
.map-card-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.empty-msg { font-size: 13px; color: var(--ink-faint); padding: 1rem 0; }

/* ---------- modal (detail popup) ---------- */
#overlay { position: fixed; inset: 0; background: rgba(23,22,15,.4); opacity: 0; visibility: hidden; transition: opacity .15s ease, visibility .15s; z-index: 40; }
#overlay.on { opacity: 1; visibility: visible; }
#modal {
  position: fixed; top: 4vh; left: 50%; transform: translate(-50%, -8px);
  width: min(700px, 92vw); max-height: 92vh; background: var(--panel); border-radius: 14px;
  box-shadow: 0 20px 60px rgba(23,22,15,.28); z-index: 41; display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; transition: opacity .15s ease, transform .15s ease, visibility .15s;
}
#modal.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.3rem 1.6rem .2rem; }
.modal-eyebrow { font-family: var(--sans); font-size: 11.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--accent-deep); }
.modal-close { background: none; border: none; font-size: 1.4rem; line-height: 1; color: var(--ink-faint); cursor: pointer; padding: .1rem .4rem; border-radius: 6px; }
.modal-close:hover { background: var(--accent-wash); color: var(--ink); }
.modal-body { overflow-y: auto; padding: .3rem 1.6rem 1.4rem; }
.modal-body h2 { font-family: var(--sans); font-size: 1.4rem; font-weight: 600; margin: 0 0 .8rem; line-height: 1.25; }
.mention-row { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: 1.4rem; }
.mention-pill { font-family: var(--sans); font-size: 11.5px; font-weight: 500; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .65rem; }
.detail-body { font-family: var(--serif); font-size: 16.5px; line-height: 1.68; color: var(--ink); }
.detail-body p { margin: 0 0 1.05rem; }
.detail-body blockquote { margin: 1rem 0 1.3rem; padding: .1rem 0 .1rem 1.2rem; border-left: 3px solid var(--accent); }
.detail-body blockquote p { color: var(--ink-soft); font-style: italic; }
.mark-btn {
  display: inline-flex; align-items: center; gap: .4rem; font-family: var(--sans); font-size: 12.5px; font-weight: 500;
  color: var(--ink-soft); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
  padding: .5rem .8rem; cursor: pointer; margin-top: .6rem;
}
.mark-btn:hover { border-color: var(--accent-deep); }
.mark-btn.on { background: var(--green-wash); border-color: var(--green); color: var(--green); }
.modal-footer {
  flex-shrink: 0; display: flex; justify-content: flex-end; gap: .5rem;
  padding: .8rem 1.6rem; border-top: 1px solid var(--rule);
}
.modal-footer button { font-family: var(--sans); font-size: 12.5px; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 8px; padding: .5rem .8rem; cursor: pointer; }
.modal-footer button:hover:not(:disabled) { border-color: var(--accent-deep); color: var(--ink); }
.modal-footer button:disabled { opacity: .35; cursor: default; }

/* ---------- matrices view ---------- */
#view-matrix { padding: 2.4rem 3rem 6rem; }
.matrix-wrap { max-width: 60rem; margin: 0 auto; }
.matrix-wrap h2 { font-family: var(--sans); font-size: 1.3rem; margin: 2.6rem 0 .8rem; }
.matrix-wrap p.intro { font-family: var(--serif); font-size: 16px; color: var(--ink-soft); max-width: 42rem; }
.mtoolbar { display: flex; justify-content: flex-end; margin-bottom: .6rem; }
.sort-toggle { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: .4rem .7rem; cursor: pointer; }
.sort-toggle.is-active { background: var(--ink); color: #F7F5EC; border-color: var(--ink); }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 2.5rem; }
table.cov { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 12px; }
table.cov th, table.cov td { border-bottom: 1px solid var(--rule); padding: .5rem .3rem; text-align: center; }
table.cov th { font-weight: 500; color: var(--ink-faint); border-bottom: 1.5px solid var(--ink); }
table.cov td:first-child, table.cov th:first-child { text-align: left; padding-left: 0; width: 42%; }
table.cov tbody tr:hover { background: var(--accent-wash); }
.cov-col { display: none; }
table.cov.show-cov .cov-col { display: table-cell; }
.cov-count { font-weight: 600; }

/* ---------- reading view ---------- */
#view-read { }
.read-wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 2rem 6rem; font-family: var(--serif); font-size: 17px; line-height: 1.7; }
.read-wrap h1 { font-family: var(--sans); font-size: 1.9rem; font-weight: 600; }
.read-wrap h2 { font-family: var(--sans); font-size: 1.3rem; font-weight: 600; margin: 3.2rem 0 .3rem; border-top: 3px solid var(--ink); padding-top: 1.3rem; }
.read-wrap h3 { font-family: var(--sans); font-size: 1.05rem; font-weight: 600; margin: 2.4rem 0 .4rem; }
.read-wrap blockquote { margin: 1rem 0 1.3rem; padding: .1rem 0 .1rem 1.2rem; border-left: 3px solid var(--accent); }
.read-wrap blockquote p { color: var(--ink-soft); font-style: italic; }
.read-wrap p { margin: 0 0 1.05rem; }
.read-wrap hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
.read-wrap strong { font-family: var(--sans); font-size: .88em; }

@media (max-width: 860px) {
  .topbar { flex-direction: column; align-items: stretch; gap: .6rem; padding: .8rem 1rem; }
  .topbar h1 { white-space: normal; font-size: 14px; line-height: 1.3; }
  .tabs { flex-wrap: wrap; margin-left: 0; }
  .progress { margin-left: 0; width: 100%; justify-content: space-between; }
  .progress-bar { flex: 1; max-width: none; }
  .pdf-btn { width: 100%; justify-content: center; }

  #view-map, #view-matrix { padding: 1.2rem 1rem 4rem; }
  .map-controls { flex-direction: column; align-items: stretch; }
  .search { width: 100%; }
  .map-grid { grid-template-columns: 1fr; }

  table.cov { min-width: 600px; }

  .modal-head { padding: 1rem 1.1rem .1rem; }
  .modal-body { padding: .2rem 1.1rem 1.1rem; }
  .modal-footer { padding: .7rem 1.1rem; }
  #modal { top: 0; height: 100%; max-height: 100%; width: 100%; border-radius: 0; }

  .read-wrap { padding: 1.6rem 1.1rem 4rem; font-size: 16px; }
  .read-wrap h1 { font-size: 1.4rem; }
  .read-wrap h2 { font-size: 1.15rem; }
}

@media (max-width: 480px) {
  .modal-footer { flex-wrap: wrap; }
  .mention-row { gap: .3rem; }
}

/* ---------- print / PDF export ---------- */
@media print {
  body { overflow: visible; }
  .app { display: block; height: auto; }
  .topbar, #overlay, #modal { display: none !important; }
  .view { display: none !important; overflow: visible !important; }
  #view-read { display: block !important; height: auto; }
  .read-wrap { max-width: none; padding: 0; }
  .read-wrap h2 { break-before: page; }
  .read-wrap h2:first-of-type { break-before: avoid; }
  .read-wrap blockquote, .read-wrap h3 { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Diferenciales y faltantes — Facultad de Educación</h1>
    <div class="tabs">
      <button class="tab active" data-view="map">Mapa</button>
      <button class="tab" data-view="matrix">Matrices</button>
      <button class="tab" data-view="read">Lectura completa</button>
    </div>
    <div class="progress">
      <span id="progress-label">0 / 44 revisadas</span>
      <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <button class="pdf-btn" id="pdf-btn">⬇ Descargar PDF</button>
  </div>

  <div class="view active" id="view-map">
    <div class="map-head">
      <p class="intro">Todas las categorías de un vistazo. Clic en una para ver el detalle.</p>
      <div class="map-controls">
        <input class="search" id="search" type="text" placeholder="Buscar por palabra o tema…">
        <button class="sort-toggle" id="map-sort-toggle">Ordenar por frecuencia ↓</button>
        <button class="chip-clear" id="clear-filters" style="display:none;">Quitar filtros</button>
      </div>
    </div>
    <div class="map-wrap" id="map-wrap"></div>
  </div>

  <div class="view" id="view-matrix">
    <div class="matrix-wrap" id="matrix-wrap"></div>
  </div>

  <div class="view" id="view-read">
    <div class="read-wrap" id="read-wrap"></div>
  </div>
</div>

<div id="overlay"></div>
<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-head">
    <span class="modal-eyebrow" id="modal-eyebrow"></span>
    <button class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>
  </div>
  <div class="modal-body" id="modal-body"></div>
  <div class="modal-footer">
    <button id="prev-btn">&larr; Anterior</button>
    <button id="next-btn">Siguiente &rarr;</button>
  </div>
</div>

<script>
const DATA = {"header_html": "<h1>Entrevistas a profesores: diferenciales y faltantes de la Facultad de Educación</h1>\n<p><strong>Fuente:</strong> 12 transcripciones anonimizadas correspondientes a 11 profesores de la Facultad de Educación (Uniandes), identificados como Profesora 1 a Profesora 11 y Profesor 1 a Profesor 10 según corresponda. Las entrevistas de Profesora 2 y Profesor 3 están divididas en dos partes y se tratan aquí como una sola voz.<br />\n<strong>Metodología:</strong> lectura completa de las transcripciones y categorización temática inductiva; las categorías emergieron del contenido, no se impusieron de antemano.</p>\n<hr />", "howto_html": "<ul>\n<li><strong>Mencionan / Menciona:</strong> qué profesores tocaron el tema, identificados con su etiqueta anonimizada. El orden de las categorías es temático, no refleja cuántas veces se mencionó cada una ni su importancia relativa.</li>\n<li>Las citas están limpiadas de muletillas de transcripción (\"eh\", \"o sea\", repeticiones) pero conservan las palabras textuales de cada profesor.</li>\n<li>Cuando un profesor matizó, dudó o se contradijo sobre un punto, o cuando la transcripción deja algo indeterminado, eso se registra explícitamente dentro de la categoría.</li>\n<li>Este documento organiza y presenta lo dicho en las entrevistas. No contiene evaluaciones, jerarquías, recomendaciones ni conclusiones.</li>\n</ul>\n<hr />", "part1_items": [{"id": "d-1", "number": 1, "title": "Modelo de prácticas pedagógicas", "mentions": ["Profesora 2", "Profesor 4", "Profesora 6", "Profesor 7", "Profesora 9", "Profesor 8", "Profesora 11"], "html": "<p>Se describe un componente de práctica que se extiende por varios semestres consecutivos y en distintas instituciones. Profesora 6 lo ubica entre cuarto y octavo semestre; Profesor 7 lo describe como cuatro semestres con variedad de colegios; Profesora 2 lo llama la columna vertebral del pregrado. Profesor 4 lo conecta con el análisis de las prácticas en territorio. Profesora 11 agrega que ese modelo hace que los egresados entiendan qué pasa en el aula y sean referentes de calidad capaces de analizar las prácticas.</p>\n<blockquote>\n<p>Profesora 2: <em>\"Necesitamos seguir profundizando toda la formación que ocurre en las prácticas y en los colegios y nuestra secuencia de prácticas. Ahí está concebido como la columna vertebral del pregrado.\"</em><br />\nProfesora 6: <em>\"El hecho de que nuestros estudiantes puedan estar en un contexto real desde cuarto semestre hasta octavo semestre. Creo que eso los fortalece muchísimo.\"</em><br />\nProfesor 7: <em>\"Todas las facultades de educación en el país tienen que tener un modelo de prácticas, pero me parece que nuestro modelo aquí en Bogotá y en las afueras es bastante riguroso.\"</em><br />\nProfesor 4: <em>\"Nuestros egresados tienen ese peso en entender muy bien lo que pasa en el aula y ver referentes de calidad, entender las prácticas, analizarlas.\"</em><br />\nProfesor 8: <em>\"A partir de cuarto semestre la práctica, lo disciplinar y lo pedagógico se empieza a articular.\"</em><br />\nProfesora 11: <em>\"Modelo de prácticas sólido: los egresados saben y entienden qué pasa en el aula, siendo referentes de calidad capaces de entender y analizar las prácticas.\"</em><br />\nProfesora 9: <em>\"El programa de prácticas en general.\"</em></p>\n</blockquote>\n<p>Profesora 9 lo menciona dentro de una lista de elementos que enumera.</p>\n<p><em>Este tema también aparece en Parte 2, punto 2, donde se señalan aspectos por resolver dentro del mismo modelo.</em></p>"}, {"id": "d-2", "number": 2, "title": "Salidas pedagógicas y prácticas rurales", "mentions": ["Profesor 7", "Profesora 9"], "html": "<p>Profesor 7 las distingue explícitamente de las prácticas: son salidas cada semestre a un lugar distinto del país. Profesora 9 menciona las salidas rurales y las prácticas rurales como elementos separados en su enumeración.</p>\n<blockquote>\n<p>Profesor 7: <em>\"Ir cada semestre a un distinto lugar en el país para ver esas aulas tan distintas y realidades educativas tan diversas. Creo que es muy formativo.\"</em><br />\nProfesora 9: <em>\"Lo otro son las prácticas rurales.\"</em></p>\n</blockquote>\n<p><em>Este tema también aparece en Parte 2, punto 4, donde se plantea como área por consolidar.</em></p>"}, {"id": "d-3", "number": 3, "title": "Formación disciplinar en los departamentos especializados", "mentions": ["Profesora 1", "Profesor 3", "Profesor 7", "Profesor 4", "Profesor 5", "Profesora 11"], "html": "<p>Los estudiantes cursan la formación disciplinar en los departamentos correspondientes de la universidad, no dentro de la Facultad de Educación. Profesor 3 y Profesora 1 lo describen en términos de con quién se aprende; Profesor 7 lo enmarca como un modelo que, según entiende, otras facultades no tienen; Profesor 4 lo llama la combinación de pedagogía, enseñanza de la disciplina y formación general. Profesor 5 lo describe como hacer los dos a la vez, disciplinar y pedagógico, cuando otras facultades solo hacen uno. Profesora 11 lo asocia además con la juventud de la Facultad y con tener un sello propio en cómo se forma a un licenciado.</p>\n<blockquote>\n<p>Profesor 3: <em>\"Los estudiantes de la licenciatura en Arte toman arte con los profesores de arte, que eso es un privilegio.\"</em><br />\nProfesora 1: <em>\"No es un pincelazo de matemáticas, no es un pincelazo de biología. Es formarse en la disciplina, no aprender de la disciplina solamente para enseñarla.\"</em><br />\nProfesor 7: <em>\"Entiendo que muchas otras facultades de educación no tienen necesariamente ese modelo.\"</em><br />\nProfesor 4: <em>\"Es el modelo distintivo de esta formación disciplinar y pedagógica, este modelo que nos diferencia de otras facultades de Colombia.\"</em><br />\nProfesor 5: <em>\"Hay unas que se especializan o muy en lo pedagógico o muy en lo disciplinar, pero un plus que tenemos nosotros es que hacemos los dos.\"</em><br />\nProfesora 11: <em>\"Articulación entre lo disciplinar (general) y lo pedagógico. Al ser una facultad más joven, tiene un sello propio en cuanto a cómo se enseña a un licenciado, formando de manera distinta a partir de un esquema/modelo propio.\"</em></p>\n</blockquote>\n<p>Profesor 7 marca su afirmación sobre otras facultades como algo que entiende, no como dato verificado.</p>"}, {"id": "d-4", "number": 4, "title": "Formación pedagógica conjunta entre licenciaturas", "mentions": ["Profesora 1"], "html": "<p>Los estudiantes de todas las licenciaturas toman juntos los cursos de pedagogía, investigación y las prácticas. Profesora 1 conecta esto con la construcción de una identidad docente común, más allá de la disciplina de cada uno.</p>\n<blockquote>\n<p>Profesora 1: <em>\"Que se formen juntos como profesores y que su identidad sea ser profesor y ser educador y ser transformador de vidas.\"</em></p>\n</blockquote>\n<p>Profesora 1 añade que este efecto probablemente no lo perciben los estudiantes sino mucho después de graduarse, y menciona que a veces le preguntan por qué los de matemáticas toman clase con los de educación inicial.</p>"}, {"id": "d-5", "number": 5, "title": "Cursos compartidos con estudiantes de maestría", "mentions": ["Profesora 1"], "html": "<p>Algunos cursos de pregrado se dictan junto con estudiantes de maestría, que son maestros en servicio.</p>\n<blockquote>\n<p>Profesora 1: <em>\"Les permite estar en interacción permanente con maestros en servicio, no solamente con sus profesores, sino con compañeros que están trayendo las realidades del aula todo el tiempo.\"</em></p>\n</blockquote>\n<p>Profesora 1 registra que los estudiantes de ambos niveles no perciben esto como ventaja y que se quejan, y que para los profesores es exigente diseñar cursos para ambas poblaciones.</p>"}, {"id": "d-6", "number": 6, "title": "Carga de créditos y espacio curricular", "mentions": ["Profesora 1"], "html": "<p>Los programas tienen menos créditos que el promedio que ella atribuye a las licenciaturas del país (122–125 en ocho semestres, frente a 140–150 en diez).</p>\n<blockquote>\n<p>Profesora 1: <em>\"A todo mundo le parece como uy, pero eso no es como demasiado superficial. Pero yo creo que por el contrario, por un lado les da mayor posibilidad de profundidad y por otro lado les permite tener espacio para formarse en otras cosas.\"</em></p>\n</blockquote>\n<p>Profesora 1 matiza que el aprovechamiento depende de cada estudiante, y observa que algunos usan ese espacio para repetir cursos.</p>"}, {"id": "d-7", "number": 7, "title": "Inicio de maestría durante el pregrado (coterminal)", "mentions": ["Profesora 1"], "html": "<blockquote>\n<p>Profesora 1: <em>\"Iniciar la maestría mientras está en pregrado y terminarla antes. Yo también creo que es una ventaja enorme.\"</em></p>\n</blockquote>\n<p>Añade que los estudiantes no la aprovechan tanto como quisieran.</p>"}, {"id": "d-8", "number": 8, "title": "Formación en investigación", "mentions": ["Profesora 1", "Profesor 3", "Profesor 4", "Profesor 5", "Profesora 6", "Profesor 8", "Profesora 11"], "html": "<p>Profesora 6 describe una secuencia que empieza con observaciones de aula en los primeros semestres y continúa con cursos de investigación, estadística e investigación-acción en el aula. Profesor 8 se refiere al alcance de la investigación de la Facultad y a su presencia en las mallas curriculares. Profesor 3 la vincula con la capacidad de reflexionar sobre la propia práctica. Profesora 1 la conecta con ser profesores que investigan permanentemente sobre lo que enseñan. Profesor 4 habla desde su rol en la dirección de investigación y dice que el componente se fortalece. Profesor 5 lo asocia con involucrar a los estudiantes en los propios grupos de investigación. Profesora 11 lo resume como un componente de investigación fuerte.</p>\n<blockquote>\n<p>Profesora 6: <em>\"Posiciona a nuestros egresados como agentes y no como reproductores de un currículo.\"</em><br />\nProfesor 8: <em>\"La investigación y las redes de investigación y el alcance de la investigación que se hace en esta facultad es un enorme diferencial con relación a otras propuestas de formación inicial de docentes.\"</em><br />\nProfesor 3: <em>\"Que tengan esa formación en investigación educativa para que puedan reflexionar sistemáticamente sobre su propia práctica.\"</em><br />\nProfesora 1: <em>\"Somos profesores que estamos haciendo investigación permanentemente sobre asuntos de la investigación que permean el campo pedagógico.\"</em><br />\nProfesor 4: <em>\"Aquí hablo como director de investigación: es un componente fuerte de investigación que cada vez se fortalece más.\"</em><br />\nProfesor 5: <em>\"Hay un compromiso muy fuerte por cómo hago mi clase mejor, cómo involucro a mis estudiantes en mis grupos de investigación.\"</em><br />\nProfesora 11: <em>\"Componente de investigación fuerte.\"</em></p>\n</blockquote>\n<p><em>Este tema también aparece en Parte 2, punto 8, donde se plantea la vinculación de estudiantes a la producción académica.</em></p>"}, {"id": "d-9", "number": 9, "title": "Formación socioemocional y calidad de las interacciones", "mentions": ["Profesora 1", "Profesora 2", "Profesora 9"], "html": "<p>Profesora 2 describe una alianza con Teachstone y el uso del sistema CLASS (Classroom Assessment Scoring System) como marco que orienta la formación, con tres pilares: lo pedagógico, el clima emocional y la gestión de aula. Profesora 1 describe el mismo marco desde la observación de clases y los criterios para juzgar su calidad. Profesora 9 menciona el soporte emocional a estudiantes y la formación hacia la diversidad como elementos de su lista.</p>\n<blockquote>\n<p>Profesora 2: <em>\"Desde muy temprano hicimos esa alianza con el marco de las interacciones efectivas y con Teachstone.\"</em><br />\nProfesora 2: <em>\"En las facultades de educación típicamente tú aprendes cómo enseñar una disciplina o aprendes lo que se llama una didáctica. Pero no de esta manera comprensiva.\"</em><br />\nProfesora 1: <em>\"La formación social y emocional de nuestros licenciados hace parte central del eje de formación de esos futuros maestros. Estoy segura de que ninguna licenciatura en este país tiene eso tan claro.\"</em><br />\nProfesora 9: <em>\"El acompañamiento y soporte emocional que tienen los estudiantes de esta facultad.\"</em></p>\n</blockquote>\n<p>Profesora 1 presenta este punto señalando explícitamente su propio sesgo: <em>\"voy a poner mi sesgo acá por encima de todo.\"</em></p>"}, {"id": "d-10", "number": 10, "title": "Curso de manejo de aula", "mentions": ["Profesora 1"], "html": "<blockquote>\n<p>Profesora 1: <em>\"Es la única licenciatura en el país, aún todavía, que tiene un curso de manejo de aula donde eso se habla directamente, se entrenan sobre eso.\"</em></p>\n</blockquote>\n<p>Profesora 1 matiza esta afirmación dentro de la misma intervención: menciona que otra universidad tiene un curso con un título similar y duda sobre su contenido actual, y señala que la Javeriana estaría comenzando a implementar un curso de clima de aula.</p>"}, {"id": "d-11", "number": 11, "title": "El currículo como objeto de formación y de seguimiento", "mentions": ["Profesora 6", "Profesora 9", "Profesor 4"], "html": "<p>Profesora 6 lo atribuye a la orientación con que se creó la Facultad. Profesora 9 describe un seguimiento sistemático a la malla curricular y a los aprendizajes de los estudiantes, que vincula con la decisión de cuándo hacer cambios. Profesor 4 menciona el diseño curricular como sello.</p>\n<blockquote>\n<p>Profesora 6: <em>\"Reconocer la importancia del currículo. Que eso no en todas las universidades sucede.\"</em><br />\nProfesora 9: <em>\"Hay un seguimiento sistemático y riguroso del currículo con el que se forma a los estudiantes y de sus aprendizajes.\"</em><br />\nProfesor 4: <em>\"Ese es el sello fuerte hacia el diseño curricular y la preocupación por el análisis de las prácticas en territorio.\"</em></p>\n</blockquote>"}, {"id": "d-12", "number": 12, "title": "Curso de estadística para todas las licenciaturas", "mentions": ["Profesora 1"], "html": "<blockquote>\n<p>Profesora 1: <em>\"Somos de las pocas licenciaturas que tiene un curso en estadística que toman todos los estudiantes, desde la educación infantil hasta artes.\"</em></p>\n</blockquote>\n<p>Lo vincula con comprender el sistema educativo colombiano desde lo cuantitativo además de lo cualitativo.</p>"}, {"id": "d-13", "number": 13, "title": "Formación en escritura", "mentions": ["Profesora 6"], "html": "<blockquote>\n<p>Profesora 6: <em>\"El cuidado de que aprendan a escribir. Eso yo creo que es algo muy importante también de la formación en esta propuesta educativa.\"</em></p>\n</blockquote>\n<p>Lo presenta asociado al componente de investigación.</p>"}, {"id": "d-14", "number": 14, "title": "Formación ética, crítica y agencia docente", "mentions": ["Profesor 7", "Profesor 5", "Profesor 3"], "html": "<p>Profesor 7 la plantea como ir más allá de las competencias técnicas, formando docentes que no sean solo ejecutores de política. Profesor 5 se refiere al compromiso de los egresados con la sociedad. Profesor 3 describe maestros conscientes de elementos que van más allá del contenido.</p>\n<blockquote>\n<p>Profesor 7: <em>\"No estamos interesados simplemente en fomentar competencias técnicas. Un buen maestro también es ético, un buen maestro también es crítico. Son agentes que tienen agencia, que tienen juicio.\"</em><br />\nProfesor 5: <em>\"Salen con ese compromiso de amor por la sociedad, de retribuir, de ser muy conscientes de que la educación sí transforma porque los transformó a ellos.\"</em><br />\nProfesor 3: <em>\"Nuestros maestros son conscientes de una gran cantidad de cosas que van más allá de enseñar el contenido y que además piensan el contenido de manera pedagógica.\"</em></p>\n</blockquote>\n<p>Profesor 7 introduce un matiz sobre este punto: <em>\"Yo sé que en muchas partes tienen quizás también ese discurso, pero aquí realmente somos rigurosos en pensar cómo podemos garantizar esa criticidad.\"</em></p>"}, {"id": "d-15", "number": 15, "title": "Orientación hacia el futuro", "mentions": ["Profesor 7"], "html": "<blockquote>\n<p>Profesor 7: <em>\"Estamos más y más pensando cómo preparar a nuestros docentes y maestras para un futuro incierto, un futuro que todavía no existe, en un mundo laboral que está cambiando tan rápido.\"</em></p>\n</blockquote>\n<p>Lo atribuye al ADN de la universidad y lo remonta a su fundación.</p>"}, {"id": "d-16", "number": 16, "title": "Formación doctoral, diversidad de origen académico e interdisciplinariedad", "mentions": ["Profesor 3", "Profesor 4", "Profesor 7", "Profesor 5", "Profesora 11"], "html": "<p>Profesor 3 señala que todos los profesores tienen doctorado, obtenidos en distintos lugares y con distintos enfoques, y que provienen de pregrados distintos. Profesor 5 describe la transversalidad temática entre colegas. Profesor 7 los describe como referentes en sus áreas, con docencia e investigación. Profesor 4 lo enmarca como calidad de la planta con sello internacional. Profesora 11 lo enuncia como calidad de los profesores con un sello internacional en la formación.</p>\n<blockquote>\n<p>Profesor 3: <em>\"Todos los profesores de esta Facultad de Educación tenemos doctorado y son doctorados desarrollados en diversos lugares del mundo con diversos enfoques, lo cual también nos hace muy pluralistas.\"</em><br />\nProfesor 3: <em>\"Esta facultad es de por sí interdisciplinaria y la gente se ha formado en disciplinas académicas y científicas importantes y variadas.\"</em><br />\nProfesor 5: <em>\"Aquí tenemos profes que hacen temas de innovación, competencias globales, competencias ciudadanas, educación STEM, temas de género.\"</em><br />\nProfesor 7: <em>\"Los profesores que están aquí son muy especiales, tienen un compromiso muy profundo con lo que hacen en cuanto a docencia, pero también investigan, entonces son referentes cada uno en su área, están en diferentes trayectorias.\"</em><br />\nProfesor 4: <em>\"Está la calidad de los profesores que constituimos la planta, porque allí estamos imprimiendo un sello internacional, no solo nacional.\"</em><br />\nProfesora 11: <em>\"Calidad de los profesores, con un sello internacional en la formación.\"</em></p>\n</blockquote>\n<p>Profesor 3 añade que la gente pierde de vista esta variabilidad por el estereotipo que existe sobre los maestros.</p>"}, {"id": "d-17", "number": 17, "title": "Profesores como investigadores activos y carga docente", "mentions": ["Profesora 1", "Profesor 8", "Profesor 5"], "html": "<p>Profesora 1 vincula la posibilidad de investigar con el número de cursos que se dictan por semestre.</p>\n<blockquote>\n<p>Profesora 1: <em>\"Dictando dos a máximo tres cursos al semestre, a diferencia de otras universidades donde dictan cinco, seis, siete cursos.\"</em><br />\nProfesora 1: <em>\"Aquí en verdad somos investigadores, nos gusta investigar, nos apasiona.\"</em><br />\nProfesor 8: <em>\"Aquí la investigación nutre mucho toda la malla curricular, incluyendo las del pregrado.\"</em><br />\nProfesor 5: <em>\"No solo estamos enseñando bien, formando buenos docentes, sino que tenemos investigaciones muy buenas, muy buenas.\"</em></p>\n</blockquote>\n<p>Profesora 1 registra en la misma intervención una limitación que atribuye a este perfil: <em>\"Es posible que tengamos la limitación de que nosotros no somos profesores de colegio, entonces no tenemos la experiencia directa del colegio.\"</em> También señala que publican menos de lo que investigan.</p>"}, {"id": "d-18", "number": 18, "title": "Redes internacionales y referentes de otros contextos", "mentions": ["Profesor 4", "Profesor 7", "Profesor 5", "Profesora 11"], "html": "<p>Profesor 4 describe cómo la formación en el exterior y las redes se traducen en los contenidos que se llevan a clase, y establece una comparación con facultades que describe como de mirada más local. Profesor 7 lo llama sensibilidad internacional y lo vincula con no perder de vista lo local. Profesor 5 lo conecta con su propia formación en el exterior y con un énfasis en pensar globalmente. Profesora 11 lo asocia con estar a la vanguardia frente a los estándares internacionales.</p>\n<blockquote>\n<p>Profesor 4: <em>\"Cuando yo hablo de evaluación, yo sé que esto se produce mucho más en Norteamérica. Cuando yo hablo de innovación, traigo cosas que se discuten en Inglaterra o en Europa.\"</em><br />\nProfesor 7: <em>\"Traemos el mundo, lo traemos a repensar problemas educativos en Colombia.\"</em><br />\nProfesor 5: <em>\"Había un énfasis en piensa globalmente, piensa críticamente, eres un ciudadano del mundo. Y yo creo que Los Andes tiene un modelo así.\"</em><br />\nProfesora 11: <em>\"Planta profesoral formada internacionalmente, lo que asegura estar a la vanguardia frente a los estándares internacionales.\"</em></p>\n</blockquote>\n<p>Profesor 4 aclara sobre las facultades de mirada local: <em>\"que está bien, pero yo creo que es importante abrir la mirada.\"</em></p>"}, {"id": "d-19", "number": 19, "title": "Visión amplia de la educación transmitida al estudiante", "mentions": ["Profesor 5"], "html": "<p>Profesor 5 compara el modelo con el de las universidades de artes liberales en Estados Unidos, donde él estudió.</p>\n<blockquote>\n<p>Profesor 5: <em>\"Van a salir con una visión más grande, más global, de qué es la educación, de para qué sirve la educación.\"</em></p>\n</blockquote>"}, {"id": "d-20", "number": 20, "title": "Acompañamiento y cercanía", "mentions": ["Profesora 6", "Profesora 9", "Profesor 5", "Profesora 2"], "html": "<p>Profesora 6 menciona el trabajo con la Decanatura de Estudiantes y los ajustes razonables posteriores a la pandemia, y señala que los estudiantes perciben la diferencia cuando cursan materias en otras facultades. Profesora 9 propone una formulación para nombrarlo. Profesor 5 habla del compromiso con el bienestar de los estudiantes más allá de lo académico. Profesora 2 lo describe como construir vínculos y cercanía cotidiana.</p>\n<blockquote>\n<p>Profesora 6: <em>\"La manera en la que nosotros nos acercamos a los estudiantes, el acompañamiento que les damos. Ahí hay una diferencia que además los estudiantes la sienten.\"</em><br />\nProfesora 9: <em>\"Una facultad cercana y empática con los estudiantes, que ofrece seguimiento y soporte en distintas dimensiones de su vida universitaria.\"</em><br />\nProfesor 5: <em>\"Todos estamos muy comprometidos con el bienestar de los estudiantes, no solo académicos, sino cómo están.\"</em><br />\nProfesora 2: <em>\"Parte de eso implica construir unos vínculos, tenerlos cerca, acompañarlos en la cotidianidad, hacer redes de apoyo.\"</em></p>\n</blockquote>\n<p>Profesora 6 marca como percepción propia y no verificada su comentario sobre la receptividad de estudiantes de otras facultades: <em>\"a lo mejor es un imaginario mío.\"</em></p>"}, {"id": "d-21", "number": 21, "title": "Exigencia académica junto al cuidado", "mentions": ["Profesora 6"], "html": "<blockquote>\n<p>Profesora 6: <em>\"A pesar de que cuidamos mucho las relaciones y las interacciones con los estudiantes, también hay una exigencia importante.\"</em></p>\n</blockquote>\n<p>La ubica sobre todo en los últimos semestres, cuando aumenta el tiempo en los colegios.</p>"}, {"id": "d-22", "number": 22, "title": "Rituales y vida de comunidad", "mentions": ["Profesora 6"], "html": "<p>Menciona los parches y la ceremonia de las chaquetas.</p>\n<blockquote>\n<p>Profesora 6: <em>\"Esos rituales, que además nos hacen tanta falta en este momento como humanidad, son fundamentales.\"</em></p>\n</blockquote>\n<p>Añade que algunos estudiantes al principio los toman a la ligera y que aun así considera que tienen efecto.</p>"}, {"id": "d-23", "number": 23, "title": "Semilleros y monitorías", "mentions": ["Profesora 9"], "html": "<p>Profesora 9 menciona los semilleros de investigación y las monitorías de investigación y docencia. Sobre las monitorías aclara que las considera más de la universidad que de la Facultad. Sobre los semilleros deja una duda abierta y agrega que ella no sabe hasta qué punto en otros contextos se aprende en un semillero o se le hace el trabajo a otra persona. También dice que los semilleros se han explorado poco.</p>\n<blockquote>\n<p>Profesora 9: <em>\"Son los semilleros de investigación que tenemos. Yo creo que eso lo hemos explorado muy poquito.\"</em><br />\nProfesora 9: <em>\"Como todo mundo habla de semilleros de investigación, pueda que alguien diga que no tanto.\"</em><br />\nProfesora 9: <em>\"La oportunidad de ser monitores de investigación y de docencia, otras maneras de seguirte formando.\"</em></p>\n</blockquote>"}, {"id": "d-24", "number": 24, "title": "Compromiso con brechas educativas del país", "mentions": ["Profesor 3", "Profesor 5", "Profesor 4", "Profesora 11"], "html": "<p>Profesor 3 lo asocia específicamente con la licenciatura en educación inicial. Profesor 5 menciona proyectos de educación en el territorio y trabajo en comunidades. Profesor 4 habla de conocer la realidad territorial, cultural, local y rural, y del análisis de las prácticas en territorio. Profesora 11 lo conecta con la pertinencia de la formación de un futuro licenciado.</p>\n<blockquote>\n<p>Profesor 3: <em>\"Busca trabajar por una de las brechas más grandes en el país. Es un compromiso ético y real, político y social.\"</em><br />\nProfesor 5: <em>\"Estamos metidos en proyectos de educación en el territorio. Hay gente que va a las comunidades y miran qué es lo que está pasando.\"</em><br />\nProfesor 4: <em>\"Es importante que se conozca la realidad territorial, cultural, local, rural. Esa realidad nacional es importante conocerla y saber cuál es la pertinencia de la formación de un futuro licenciado.\"</em><br />\nProfesora 11: <em>\"Atención a la realidad territorial, cultural y rural, así como a la realidad nacional, en función de la pertinencia de un futuro licenciado.\"</em></p>\n</blockquote>"}, {"id": "d-25", "number": 25, "title": "Composición socioeconómica del estudiantado", "mentions": ["Profesora 2"], "html": "<p>Profesora 2 señala que la Facultad concentra buena parte de la diversidad socioeconómica y regional que ha ganado la universidad en los últimos quince años.</p>\n<blockquote>\n<p>Profesora 2: <em>\"Esta facultad concentra buena parte de esa diversidad. Y eso es un reto muy importante.\"</em></p>\n</blockquote>\n<p>Ella lo presenta simultáneamente como característica y como reto; el desarrollo de ese reto está en Parte 2, punto 12.</p>"}, {"id": "d-26", "number": 26, "title": "Herramientas tecnológicas desarrolladas internamente", "mentions": ["Profesora 9"], "html": "<p>Menciona un software para aprender a hacer un currículo, herramientas de inteligencia artificial desarrolladas por colegas, y una simulación con gafas de realidad virtual estrenada recientemente en un curso de diseño curricular, destinada a complementar la práctica.</p>\n<blockquote>\n<p>Profesora 9: <em>\"En este país no hay ninguna otra facultad que tenga un software para aprender a hacer un currículo.\"</em></p>\n</blockquote>\n<p><em>Este tema también aparece en Parte 2, punto 9, referido a su visibilidad.</em></p>"}, {"id": "d-27", "number": 27, "title": "El pregrado como razón de ser de la Facultad", "mentions": ["Profesor 3"], "html": "<blockquote>\n<p>Profesor 3: <em>\"Sin pregrado no éramos facultad, éramos un centro.\"</em><br />\nProfesor 3: <em>\"Es muy importante que la comunidad sepa que el pregrado es el corazón de una facultad.\"</em></p>\n</blockquote>\n<p>Profesor 3 enmarca esto en la historia de la universidad, que describe como nacida bajo un modelo de college, y en el desplazamiento posterior hacia los doctorados, la investigación y los incentivos del país. Profesora 2, en otro punto de su entrevista, plantea algo relacionado al hablar de la formación en aula como base para trabajar después en otros ámbitos del sistema educativo: <em>\"esa formación ciertamente te prepara para estar en las aulas, pero también te prepara para ir a trabajar a múltiples contextos.\"</em></p>"}, {"id": "d-28", "number": 28, "title": "Juventud institucional de la Facultad", "mentions": ["Profesor 4", "Profesora 11"], "html": "<blockquote>\n<p>Profesor 4: <em>\"Nosotros tenemos diez años, pero en esos diez años hemos marcado un sello en términos de cómo se forma distinto a un licenciado.\"</em><br />\nProfesora 11: <em>\"Al ser una facultad más joven, tiene un sello propio en cuanto a cómo se enseña a un licenciado, formando de manera distinta a partir de un esquema/modelo propio.\"</em></p>\n</blockquote>\n<p>Lo contrasta con facultades que menciona celebrando sesenta y cincuenta años. Profesora 11 conecta la misma idea con la articulación entre lo disciplinar y lo pedagógico (ver punto 3).</p>"}], "part1_extras": [{"id": "d-extra-elementos-mencionados-de-forma-incidental", "title": "Elementos mencionados de forma incidental", "html": "<p>Algunos elementos aparecen dentro de explicaciones sobre otra cosa, sin ser presentados por quien habla como diferenciales en sí mismos. Se registran aquí como observación sobre el material, no como hallazgo con valor asignado:</p>\n<ul>\n<li>La carga docente de dos a tres cursos por semestre (Profesora 1, mencionada al explicar por qué es posible investigar — punto 17).</li>\n<li>El modelo de <em>college</em> en el origen de la universidad (Profesor 3, mencionado al explicar por qué el pregrado es central — punto 27).</li>\n<li>Los rituales de comunidad (Profesora 6, mencionados dentro de una enumeración más amplia sobre el cuidado de los estudiantes — punto 22).</li>\n</ul>"}], "part2_items": [{"id": "f-1", "number": 1, "title": "Didáctica específica de cada disciplina", "mentions": ["Profesora 1", "Profesor 8"], "html": "<p>Profesora 1 lo describe como un reclamo sostenido en el tiempo y menciona que proviene también de los colegios y mentores. Atribuye la dificultad al número de licenciaturas y a la falta de expertos en didáctica para cada una. Profesor 8 lo plantea desde una discusión sobre si todos los saberes pueden enseñarse igual, y menciona el caso de la reforma curricular de la Licenciatura en Matemáticas y su pregunta sobre cómo se resolvería lo equivalente en arte, literatura y filosofía.</p>\n<blockquote>\n<p>Profesora 1: <em>\"Ha habido un reclamo muy fuerte desde mucho tiempo atrás sobre por qué los estudiantes no tienen formación específica sobre la didáctica de su disciplina, y yo creo que eso hace falta. Ahí tenemos un talón de Aquiles.\"</em><br />\nProfesor 8: <em>\"No creo que todos los saberes se puedan enseñar igual. Yo no sé qué tanto tengamos resuelto eso en nuestros pregrados.\"</em></p>\n</blockquote>\n<p>Profesora 1 registra su propia posición ambivalente sobre las consecuencias: dice que a ella no le preocupa tanto porque considera que eso se puede aprender de los mentores en los colegios o de manera autónoma, y lo llama <em>\"un sacrificio que estoy dispuesta a hacer.\"</em> Profesor 8 formula su punto como pregunta abierta más que como afirmación.</p>"}, {"id": "f-2", "number": 2, "title": "Modelo de prácticas: escala, supervisión y variabilidad", "mentions": ["Profesora 2", "Profesora 1", "Profesor 7"], "html": "<p>Tres planteamientos distintos sobre el mismo modelo:</p>\n<ul>\n<li><strong>Escala.</strong> Profesora 2 describe el paso de supervisar cuarenta estudiantes a supervisar doscientos cincuenta, y menciona como posible vía vincular a estudiantes de doctorado u otras personas de apoyo.</li>\n<li><strong>Quién supervisa.</strong> Profesora 1 plantea que los supervisores deberían ser profesores activos en colegios y no profesores de planta.</li>\n<li><strong>Variabilidad de la experiencia.</strong> Profesor 7 señala que la calidad de la experiencia de práctica difiere entre estudiantes.</li>\n</ul>\n<blockquote>\n<p>Profesora 2: <em>\"La tarea de supervisar cuarenta estudiantes en las instituciones educativas es una y la tarea de supervisar doscientos cincuenta estudiantes es otra. El punto no es que el modelo que hayamos pensado no funcione. Creo que funciona muy bien, sino que es el reto de llevarlo a grande.\"</em><br />\nProfesora 1: <em>\"Testarudamente hemos querido que los profesores de práctica sean profesores de planta de la facultad y yo creo que eso es un error.\"</em><br />\nProfesor 7: <em>\"Cuando yo hablo con los estudiantes siempre pregunto: ¿y cómo te va en la práctica? Y algunos dicen maravillas y otros me dicen, pues, no muy bien.\"</em></p>\n</blockquote>\n<p>Profesor 7 acompaña su planteamiento con: <em>\"Es imperfecto el sistema, pero está funcionando. Pero necesitamos seguir pensando cómo mejorarlo.\"</em></p>"}, {"id": "f-3", "number": 3, "title": "Escenarios de práctica no escolarizados", "mentions": ["Profesor 4", "Profesora 11"], "html": "<p>Se refiere a prácticas en fundaciones, museos, universidades y otras organizaciones. Profesor 4 registra su propia dificultad para nombrar esta categoría (<em>\"comunitario, pero es que el nombre no es muy afortunado\"</em>). Profesora 11 lo plantea como necesidad de más inmersión y más prácticas.</p>\n<blockquote>\n<p>Profesor 4: <em>\"Nos falta expandir en prácticas y opciones y credenciales en otros escenarios que no sean los colegios.\"</em><br />\nProfesora 11: <em>\"Se requiere más inmersión y más prácticas: prácticas ancladas a los colegios, pero también expandidas a escenarios distintos a los colegios.\"</em></p>\n</blockquote>\n<p>Acompaña el planteamiento con una posición sobre el lugar de los colegios: <em>\"Las prácticas tienen que ser todavía ancladas a los colegios,\"</em> y menciona que atribuye ese punto a Profesora 2 y posiblemente a Profesora 9. Profesora 11 formula una posición equivalente: las prácticas siguen ancladas a los colegios, pero deben expandirse también a otros escenarios.</p>"}, {"id": "f-4", "number": 4, "title": "Educación popular, comunitaria y rural", "mentions": ["Profesora 6", "Profesor 4"], "html": "<p>Profesora 6 relata su experiencia previa con una práctica comunitaria en otra universidad y plantea que los educadores deberían ampliar el rango de espacios. Profesor 4 lo enuncia como querer más ruralidad, salidas de campo e inmersión.</p>\n<blockquote>\n<p>Profesora 6: <em>\"Todavía están esas salidas rurales, pero no está como consolidado.\"</em><br />\nProfesor 4: <em>\"Uno siempre quiere más, más ruralidad, más salidas de campo, más inmersión, más prácticas, no solo escolarizadas.\"</em></p>\n</blockquote>\n<p>Profesora 6 corrige su propia formulación mientras habla: <em>\"habría que mejorar. No, no mejorar, porque no es que se necesite mejorar, sino como un plus.\"</em></p>"}, {"id": "f-5", "number": 5, "title": "Educación inclusiva", "mentions": ["Profesora 10"], "html": "<p>Describe el curso Educación y diversidad como parte de la malla y plantea que un curso introductorio de dieciséis semanas se queda corto. Pide pasar de las perspectivas teóricas a propuestas aplicadas, con más contacto directo y trabajo en didácticas.</p>\n<blockquote>\n<p>Profesora 10: <em>\"Estamos necesitando una perspectiva más amplia sobre educación inclusiva, tal vez más cursos, tal vez otras oportunidades de formación.\"</em><br />\nProfesora 10: <em>\"Nos damos cuenta los estudiantes y yo que ese curso se queda corto.\"</em></p>\n</blockquote>\n<p>Profesora 10 extiende el faltante a la formación de los propios profesores: <em>\"Si no estamos formados no podemos formar. Nos falta a todos.\"</em> Añade una observación sobre la actitud del grupo: <em>\"Nos hemos confiado mucho en lo que sabemos que es chévere, pero creo que nos falta darnos cuenta que también podemos seguir aprendiendo como profes.\"</em></p>"}, {"id": "f-6", "number": 6, "title": "Bilingüismo", "mentions": ["Profesora 9"], "html": "<p>Aclara al ser preguntada que no se refiere al inglés como materia sino a que los licenciados de las distintas disciplinas puedan enseñar sus áreas en inglés.</p>\n<blockquote>\n<p>Profesora 9: <em>\"El tema del bilingüismo necesitamos fortalecerlo más rápidamente aquí y hacer más.\"</em></p>\n</blockquote>\n<p>Menciona también que una licenciatura en inglés no va a abrir, y que se garantizarán los cursos.</p>"}, {"id": "f-7", "number": 7, "title": "Análisis de datos, tecnología y evaluación", "mentions": ["Profesor 4", "Profesora 11"], "html": "<p>Habla desde su rol en la dirección de investigación y desde su participación en el grupo de evaluación de Ascofade, donde señala que se realiza un análisis comparado con colegas de otras facultades. Profesora 11 coincide en varios puntos: la formación en evaluación sigue siendo superficial, falta dar más peso a la inteligencia artificial y al análisis de datos como apoyo al diseño, no hay cursos de apropiación tecnológica, y falta vincular más la investigación con la evaluación a nivel curricular.</p>\n<blockquote>\n<p>Profesor 4: <em>\"No solo los Andes, no solo nuestra facultad, sino muchas tienen una formación todavía muy superficial en evaluación.\"</em><br />\nProfesor 4: <em>\"Podríamos darle más peso al análisis de datos, el uso de inteligencia artificial o de tecnologías en general para apoyar procesos de evaluación y diseño.\"</em><br />\nProfesora 11: <em>\"La formación en evaluación sigue siendo superficial.\"</em><br />\nProfesora 11: <em>\"Se le podría dar más peso a la inteligencia artificial y al análisis de datos como apoyo a los procesos de diseño.\"</em><br />\nProfesora 11: <em>\"No hay cursos sobre apropiación (tecnológica/de herramientas).\"</em><br />\nProfesora 11: <em>\"Falta vincular más la investigación y potenciar la evaluación a nivel curricular.\"</em><br />\nProfesora 11: <em>\"Falta manejo de tecnologías y análisis de datos.\"</em></p>\n</blockquote>\n<p>Enmarca esto como algo aplicable tanto a la Facultad como a otras instituciones del país.</p>"}, {"id": "f-8", "number": 8, "title": "Vinculación de estudiantes a la producción académica", "mentions": ["Profesor 5"], "html": "<p>Plantea publicar con estudiantes de pregrado, involucrarlos en semilleros y grupos de investigación de forma más activa, y crear espacios para visibilizar lo que escriben. Menciona como ejemplo un texto que una estudiante publicó en un periódico de otra facultad y la idea de una gaceta.</p>\n<blockquote>\n<p>Profesor 5: <em>\"Nos falta involucrar un poquito más a los estudiantes en lo que hacemos como investigadores, o sea, meterlos más, publicar con ellos.\"</em></p>\n</blockquote>\n<p>Profesor 5 marca repetidamente la incertidumbre de su planteamiento: <em>\"de pronto lo hacen, pero yo desconozco,\" \"de pronto estoy diciendo cosas que ya se hacen,\" \"yo creo que hay comunicación.\"</em> También menciona una barrera percibida entre profesores y estudiantes, y su intento personal de reducirla.</p>"}, {"id": "f-9", "number": 9, "title": "Visibilidad de herramientas y logros propios", "mentions": ["Profesora 9"], "html": "<blockquote>\n<p>Profesora 9: <em>\"Hacer más visibles las cosas tecnológicas que tenemos. Las podemos ampliar, pero yo creo que no son tan visibles.\"</em></p>\n</blockquote>"}, {"id": "f-10", "number": 10, "title": "Cultura interna de apertura y retroalimentación", "mentions": ["Profesor 7"], "html": "<p>Describe una tendencia a la actitud defensiva hacia colegas, hacia otras partes de la universidad y en los procesos internos de evaluación entre pares. La conecta con lo que llama una lucha histórica por el reconocimiento de la pedagogía como campo.</p>\n<blockquote>\n<p>Profesor 7: <em>\"Colaboramos, pero muchas veces queremos defender como nuestro territorio.\"</em><br />\nProfesor 7: <em>\"Somos muy defensivos en ese proceso. Eso es bueno en un sentido, porque quiere decir que nos importa, pero es malo porque necesitamos poder escuchar a los colegas y recibir su retroalimentación sin ofenderse.\"</em></p>\n</blockquote>"}, {"id": "f-11", "number": 11, "title": "Procesos de admisión y noción de excelencia", "mentions": ["Profesor 7"], "html": "<p>Plantea dos asuntos que presenta como ligados: repensar el sistema de admisión para identificar a quienes quieren ser docentes, y redefinir qué se entiende por calidad y excelencia. Menciona la noción de excelencia inclusiva como algo que está pensando, y reconoce la presión por mantener un punto de equilibrio financiero.</p>\n<blockquote>\n<p>Profesor 7: <em>\"No es necesariamente los mejores que tienen un tres treinta o arriba en el ICFES los que van a ser los mejores docentes.\"</em><br />\nProfesor 7: <em>\"Yo no sé cómo repensamos lo que es calidad y excelencia, pero desde el lente de inclusión, desde el lente de diversidad en talento, desde el lente de potencial.\"</em></p>\n</blockquote>\n<p>Lo formula como pregunta abierta más que como propuesta cerrada.</p>"}, {"id": "f-12", "number": 12, "title": "Retención y acompañamiento a estudiantes en condición de vulnerabilidad", "mentions": ["Profesora 2"], "html": "<p>Distingue dos retos que presenta como distintos: lograr que los estudiantes se matriculen y lograr que se gradúen. Vincula el segundo con la composición socioeconómica del estudiantado (Parte 1, punto 25) y con la necesidad de repensar las prácticas pedagógicas de los propios profesores. Menciona el cierre de una sala donde los estudiantes se reunían y el efecto de perder ese contacto cotidiano.</p>\n<blockquote>\n<p>Profesora 2: <em>\"Reconocer la diversidad implica también repensar nuestra práctica docente.\"</em><br />\nProfesora 2: <em>\"Ahora ya tenemos silencio, pero ese silencio va a tener un costo muy importante porque no los vemos, no sabemos.\"</em></p>\n</blockquote>\n<p><strong>Punto en el que Profesora 2 discrepa de una premisa planteada en la entrevista.</strong> Ante la pregunta de si hay un problema de retención asociado a estudiantes que ingresan por la beca sin querer ser profesores, responde que no lo considera un problema grave y pide datos: <em>\"Si me muestran las cifras y me convencen de lo contrario, con mucho gusto cambio de opinión.\"</em> Atribuye las dificultades de desempeño al origen socioeconómico y a la condición de vulnerabilidad, no a la motivación de ingreso, y señala que todas las carreras tienen personas que entran por razones diversas.</p>"}, {"id": "f-13", "number": 13, "title": "Recursos económicos y planta docente", "mentions": ["Profesor 3", "Profesora 2"], "html": "<p>Profesor 3 menciona la solvencia económica y la necesidad de más profesores en algunas áreas, y menciona educación inicial y matemáticas. Profesora 2 lo plantea desde el costo para los estudiantes.</p>\n<blockquote>\n<p>Profesor 3: <em>\"Quisiéramos tener más solvencia económica para poder hacer muchísimas más cosas que se nos ocurren y nos gustan, pero eso no es que le falte a la facultad.\"</em><br />\nProfesora 2: <em>\"Cómo lograr que las personas que quieren ser profesores puedan pagar y estudiar en la Universidad de los Andes. Ese es un reto que sigue existiendo desde la fundación de la facultad.\"</em></p>\n</blockquote>\n<p>Profesor 3 encuadra su respuesta completa a la pregunta por lo faltante de una manera particular: <em>\"No nos faltan cosas en lo fundamental. No es que le falte, sino que hay que seguir fortaleciendo aquellas cosas que hacemos bien.\"</em> Lo llama enfoque apreciativo.</p>"}, {"id": "f-14", "number": 14, "title": "Acompañamiento en el doctorado", "mentions": ["Profesora 6"], "html": "<p>Plantea la necesidad de una reflexión colectiva entre profesores sobre las competencias que los estudiantes de doctorado requieren desarrollar, y de un acompañamiento que describe como más humano en los procesos de tesis.</p>\n<blockquote>\n<p>Profesora 6: <em>\"Algunos de los estudiantes que llegan al doctorado requieren desarrollar competencias que no necesariamente desarrollaron en sus maestrías o en sus pregrados.\"</em><br />\nProfesora 6: <em>\"A veces la gente tiene miedo de desarrollar ciertas cosas porque no se cree capaz. Pero tampoco nosotros hacemos algo para que ellos vean lo que sí pueden hacer.\"</em></p>\n</blockquote>"}, {"id": "f-15", "number": 15, "title": "Tiempo y carga percibida", "mentions": ["Profesor 7"], "html": "<p>Profesor 7 menciona el tiempo como algo que falta, pero atribuye la causa fuera de la Facultad.</p>\n<blockquote>\n<p>Profesor 7: <em>\"Yo intuyo que no es algo que viene desde la facultad, que es como de la Universidad y de la globalización.\"</em></p>\n</blockquote>\n<p>Desarrolla el punto refiriéndose a lecturas sobre jóvenes, tecnología y salud mental, y aclara que los considera procesos más amplios que las políticas de la Facultad. Marca esta parte como intuición.</p>"}, {"id": "f-16", "number": 16, "title": "El lugar de la pedagogía en la formación docente", "mentions": ["Profesor 8"], "html": "<p>Profesor 8 plantea este punto principalmente como afirmación sobre la formación docente en el país, no sobre la Facultad: sostiene que falta pedagogía en todos los niveles de formación docente y describe un debate entre las ciencias de la educación, las ciencias del aprendizaje y la pedagogía como campo con tradición propia.</p>\n<blockquote>\n<p>Profesor 8: <em>\"Lo que le falta a la formación docente de este país es pedagogía. Porque luego resulta ser que eso es lo que le falta a los docentes en ejercicio.\"</em><br />\nProfesor 8: <em>\"Las facultades de educación suponen que el espacio de práctica es un espacio de aplicación de lo que se aprende en las materias teóricas. Hay una relación todavía muy moderna y en mi opinión equivocada.\"</em></p>\n</blockquote>\n<p>Añade una afirmación sobre dónde reside el saber de la enseñanza: <em>\"El saber de la buena enseñanza no está en las universidades. Está en las normales, está en los colegios.\"</em> También señala que no se trata de resolver la tensión entre saber teórico y saber práctico sino de habitarla.</p>"}], "part2_extras": [], "matrix_intro_html": "<p>Registra qué profesor tocó cada tema. Es una descripción de cómo se distribuyó la conversación entre las transcripciones, en el mismo orden temático del documento — no está ordenada por frecuencia. Un tema tratado por una sola persona puede corresponder a su área de especialidad, al rumbo de esa entrevista en particular, o a algo que los demás dieron por supuesto.</p>", "matrix_p1": {"title": "Parte 1 — Diferenciales", "profs": ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9", "P10", "P11"], "rows": [{"label": "1. Modelo de prácticas", "cells": {"P1": false, "P2": true, "P3": false, "P4": true, "P5": false, "P6": true, "P7": true, "P8": true, "P9": true, "P10": false, "P11": true}}, {"label": "2. Salidas pedagógicas y prácticas rurales", "cells": {"P1": false, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": true, "P8": false, "P9": true, "P10": false, "P11": false}}, {"label": "3. Formación disciplinar en departamentos", "cells": {"P1": true, "P2": false, "P3": true, "P4": true, "P5": true, "P6": false, "P7": true, "P8": false, "P9": false, "P10": false, "P11": true}}, {"label": "4. Formación pedagógica conjunta", "cells": {"P1": true, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "5. Cursos compartidos con maestría", "cells": {"P1": true, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "6. Carga de créditos y espacio curricular", "cells": {"P1": true, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "7. Coterminal", "cells": {"P1": true, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "8. Formación en investigación", "cells": {"P1": true, "P2": false, "P3": true, "P4": true, "P5": true, "P6": true, "P7": false, "P8": true, e, "P7": false, "P8": false, "P9": true, "P10": false, "P11": false}}, {"label": "10. Cultura interna de apertura", "cells": {"P1": false, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": true, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "11. Admisión y noción de excelencia", "cells": {"P1": false, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": true, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "12. Retención y acompañamiento", "cells": {"P1": false, "P2": true, "P3": false, "P4": false, "P5": false, "P6": false, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "13. Recursos económicos y planta", "cells": {"P1": false, "P2": true, "P3": true, "P4": false, "P5": false, "P6": false, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "14. Acompañamiento en el doctorado", "cells": {"P1": false, "P2": false, "P3": false, "P4": false, "P5": false, "P6": true, "P7": false, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "15. Tiempo y carga percibida", "cells": {"P1": false, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": true, "P8": false, "P9": false, "P10": false, "P11": false}}, {"label": "16. El lugar de la pedagogía", "cells": {"P1": false, "P2": false, "P3": false, "P4": false, "P5": false, "P6": false, "P7": false, "P8": true, "P9": false, "P10": false, "P11": false}}]}, "obs_html": "<p>Registro de características del propio material que conviene tener presentes al analizarlo. No son hallazgos ni interpretaciones del contenido.</p>\n<p><strong>Temas que aparecen en ambas partes.</strong> El modelo de prácticas (Parte 1, punto 1 y Parte 2, punto 2), la educación rural (Parte 1, punto 2 y Parte 2, punto 4), la investigación (Parte 1, punto 8 y Parte 2, punto 8) y las herramientas tecnológicas (Parte 1, punto 26 y Parte 2, punto 9) son tratados por distintos profesores —o por el mismo— como fortaleza y como pendiente. No se resolvieron aquí en una sola dirección.</p>\n<p><strong>Grados de certeza declarados.</strong> Varios profesores marcan explícitamente el estatus de lo que dicen. Profesora 1 anuncia su sesgo antes de exponer un punto y anticipa desacuerdo de colegas en otro. Profesor 5 dice repetidamente desconocer si algo ya se hace. Profesora 6 identifica una percepción suya como posible imaginario. Profesor 7 marca una parte como intuición. Profesora 9 deja una duda abierta sobre los semilleros. Estas marcas se conservaron en cada categoría.</p>\n<p><strong>Afirmaciones comparativas con otras instituciones.</strong> Varias afirmaciones comparan a la Facultad con otras facultades del país o del mundo (Parte 1, puntos 3, 9, 10, 12, 17, 18 y 26). Algunas se presentan como certeza, otras como impresión. Ninguna fue verificada contra fuentes externas en este ejercicio.</p>\n<p><strong>Un desacuerdo con una premisa de la entrevista.</strong> En Parte 2, punto 12, Profesora 2 discrepa de una premisa planteada en la pregunta y solicita datos antes de aceptarla.</p>\n<p><strong>Encuadre particular de una respuesta.</strong> Profesor 3 responde a la pregunta por lo faltante reformulándola: sostiene que no faltan cosas en lo fundamental y que se trata de fortalecer lo que ya se hace bien. Sus menciones en Parte 2, punto 13, están dentro de ese encuadre.</p>\n<p><strong>Fragmentos incompletos.</strong> Algunas intervenciones quedan cortadas o cambian de tema a mitad de frase, propio del registro oral. Donde eso afectaba la comprensión de un punto, no se completó la idea. La entrevista de Profesor 5 termina con una frase incompleta sobre diversidad socioeconómica que no alcanza a desarrollarse.</p>"};
// Review state lives in memory only (this page is a standalone, shareable
// document — no browser storage is used so it works the same for anyone
// who opens it, and it prints cleanly to PDF).
let reviewed = {};

const allItems = [];
DATA.part1_items.forEach(it => allItems.push(Object.assign({part: "Parte 1 — Diferenciales"}, it)));
DATA.part2_items.forEach(it => allItems.push(Object.assign({part: "Parte 2 — Faltantes"}, it)));
const TOTAL = allItems.length;

let searchTerm = "";
let selectedId = null;
let sortByFrequency = false;

document.getElementById("clear-filters").addEventListener("click", () => {
  searchTerm = "";
  document.getElementById("search").value = "";
  renderMap();
});
document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim();
  renderMap();
});
document.getElementById("map-sort-toggle").addEventListener("click", (e) => {
  sortByFrequency = !sortByFrequency;
  e.target.classList.toggle("is-active", sortByFrequency);
  e.target.textContent = sortByFrequency ? "Orden temático" : "Ordenar por frecuencia ↓";
  renderMap();
});

function stripAccents(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// Word-stem search: matching on the first few letters of each search word
// (accent-insensitive) means "currículo" also finds "curricular",
// "currículum", etc., instead of requiring an exact substring match.
function matchesFilters(it) {
  if (searchTerm) {
    const hay = stripAccents((it.title + " " + (it.html || "")).toLowerCase());
    const words = stripAccents(searchTerm.toLowerCase()).split(/\s+/).filter(Boolean);
    const allMatch = words.every(w => {
      const escaped = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (w.length < 4) {
        // short words (e.g. "IA", "TIC"): match as a whole word only, so
        // they don't false-positive inside longer unrelated words
        return new RegExp("\\b" + escaped + "\\b").test(hay);
      }
      // longer words: match by word-stem, so "currículo" also finds
      // "curricular", "currículum", etc.
      const stem = escaped.slice(0, Math.min(escaped.length, 6));
      return new RegExp("\\b" + stem).test(hay);
    });
    if (!allMatch) return false;
  }
  return true;
}

function updateProgress() {
  let done = 0;
  allItems.forEach(it => { if (reviewed[it.id]) done++; });
  document.getElementById("progress-label").textContent = done + " / " + TOTAL + " revisadas";
  document.getElementById("progress-fill").style.width = (done / TOTAL * 100) + "%";
}

function renderMap() {
  document.getElementById("clear-filters").style.display = searchTerm ? "block" : "none";

  const wrap = document.getElementById("map-wrap");
  wrap.innerHTML = "";

  [["Parte 1 — Diferenciales", DATA.part1_items], ["Parte 2 — Faltantes", DATA.part2_items]].forEach(([label, rawItems]) => {
    let items = rawItems.map(r => allItems.find(x => x.id === r.id)).filter(matchesFilters);
    if (items.length === 0) return;
    if (sortByFrequency) {
      items = items.slice().sort((a, b) => {
        const d = (b.mentions || []).length - (a.mentions || []).length;
        return d !== 0 ? d : a.number - b.number;
      });
    }
    const h = document.createElement("h2");
    h.textContent = label;
    wrap.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "map-grid";
    items.forEach(it => grid.appendChild(buildCard(it)));
    wrap.appendChild(grid);
  });

  if (wrap.children.length === 0) {
    const e = document.createElement("div");
    e.className = "empty-msg";
    e.textContent = "Ninguna categoría coincide con el filtro.";
    wrap.appendChild(e);
  }
}

function buildCard(it) {
  const card = document.createElement("button");
  card.className = "map-card" + (reviewed[it.id] ? " done" : "");
  const dots = '<div class="map-card-dots">' + (it.mentions || []).map(() => "<span></span>").join("") + '</div>';
  card.innerHTML =
    '<div class="map-card-top">' +
      '<span class="map-card-num">' + it.number + '</span>' +
      '<span class="map-card-check">' + (reviewed[it.id] ? "✓" : "") + '</span>' +
    '</div>' +
    '<span class="map-card-title">' + it.title + '</span>' +
    '<div class="map-card-foot">' + dots + '</div>';
  card.addEventListener("click", () => openModal(it.id));
  return card;
}

// ---- modal ----------------------------------------------------------
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function currentList() {
  return allItems.filter(matchesFilters);
}

function openModal(id) {
  selectedId = id;
  renderModal();
  overlay.classList.add("on");
  modal.classList.add("on");
}
function closeModal() {
  overlay.classList.remove("on");
  modal.classList.remove("on");
}

function renderModal() {
  const it = allItems.find(x => x.id === selectedId);
  if (!it) return;

  document.getElementById("modal-eyebrow").textContent = it.part + " · Punto " + it.number;

  let mentionsHtml = "";
  if (it.mentions && it.mentions.length) {
    mentionsHtml = '<div class="mention-row">' +
      it.mentions.map(m => '<span class="mention-pill">' + m + '</span>').join("") +
      '</div>';
  }

  const body = document.getElementById("modal-body");
  body.innerHTML =
    '<h2>' + it.title + '</h2>' +
    mentionsHtml +
    '<div class="detail-body">' + it.html + '</div>' +
    '<button class="mark-btn' + (reviewed[it.id] ? ' on' : '') + '" id="mark-btn">' +
    (reviewed[it.id] ? '✓ Marcada como revisada' : 'Marcar como revisada') + '</button>';
  body.scrollTop = 0;

  document.getElementById("mark-btn").addEventListener("click", () => {
    reviewed[it.id] = !reviewed[it.id];
    updateProgress();
    renderMap();
    renderModal();
  });

  const list = currentList();
  const idx = list.findIndex(x => x.id === it.id);
  const prev = idx > 0 ? list[idx - 1] : null;
  const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  prevBtn.disabled = !prev;
  nextBtn.disabled = !next;
  prevBtn.onclick = prev ? () => openModal(prev.id) : null;
  nextBtn.onclick = next ? () => openModal(next.id) : null;
}

document.getElementById("modal-close").addEventListener("click", closeModal);
overlay.addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

renderMap();
updateProgress();

document.getElementById("pdf-btn").addEventListener("click", () => {
  window.print();
});

// ---- tabs ---------------------------------------------------------------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + tab.dataset.view).classList.add("active");
  });
});

// ---- matrices view --------------------------------------------------
function buildMatrix(container, matrix, idPrefix) {
  const wrap = document.createElement("div");
  const toolbar = document.createElement("div");
  toolbar.className = "mtoolbar";
  const btn = document.createElement("button");
  btn.className = "sort-toggle";
  btn.textContent = "Ordenar por cobertura ↓";
  toolbar.appendChild(btn);
  wrap.appendChild(toolbar);

  const table = document.createElement("table");
  table.className = "cov";
  table.id = idPrefix;
  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  htr.innerHTML = "<th>Tema</th>" + matrix.profs.map(p => "<th>" + p + "</th>").join("") + '<th class="cov-col">Cobertura</th>';
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  matrix.rows.forEach((row, i) => {
    const tr = document.createElement("tr");
    const count = matrix.profs.filter(p => row.cells[p]).length;
    tr.dataset.count = count;
    tr.dataset.orig = i;
    tr.innerHTML = "<td>" + row.label + "</td>" +
      matrix.profs.map(p => "<td>" + (row.cells[p] ? "•" : "") + "</td>").join("") +
      '<td class="cov-col cov-count">' + count + "</td>";
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  const scroller = document.createElement("div");
  scroller.className = "table-scroll";
  scroller.appendChild(table);
  wrap.appendChild(scroller);
  container.appendChild(wrap);

  let sorted = false;
  const rows = Array.prototype.slice.call(tbody.rows);
  btn.addEventListener("click", () => {
    sorted = !sorted;
    btn.classList.toggle("is-active", sorted);
    table.classList.toggle("show-cov", sorted);
    btn.textContent = sorted ? "Orden temático" : "Ordenar por cobertura ↓";
    const ordered = rows.slice().sort((a, b) => {
      if (!sorted) return (+a.dataset.orig) - (+b.dataset.orig);
      const d = (+b.dataset.count) - (+a.dataset.count);
      return d !== 0 ? d : (+a.dataset.orig - +b.dataset.orig);
    });
    ordered.forEach(r => tbody.appendChild(r));
  });
}

const matrixWrap = document.getElementById("matrix-wrap");
matrixWrap.innerHTML = '<div class="intro">' + DATA.matrix_intro_html + "</div>";
const h2a = document.createElement("h2"); h2a.textContent = DATA.matrix_p1.title; matrixWrap.appendChild(h2a);
buildMatrix(matrixWrap, DATA.matrix_p1, "cov-table-0");
const h2b = document.createElement("h2"); h2b.textContent = DATA.matrix_p2.title; matrixWrap.appendChild(h2b);
buildMatrix(matrixWrap, DATA.matrix_p2, "cov-table-1");

// ---- linear reading view ---------------------------------------------
function sectionHtml(items, extras) {
  let out = "";
  items.forEach(it => {
    out += "<h3>" + it.number + ". " + it.title + "</h3>";
    if (it.mentions && it.mentions.length) {
      out += "<p><strong>" + (it.mentions.length > 1 ? "Mencionan: " : "Menciona: ") + it.mentions.join(", ") + "</strong></p>";
    }
    out += it.html + "<hr>";
  });
  extras.forEach(it => { out += "<h3>" + it.title + "</h3>" + it.html + "<hr>"; });
  return out;
}

const readWrap = document.getElementById("read-wrap");

function staticMatrixHtml(matrix) {
  let html = '<table class="cov" style="margin:1.2rem 0 2rem;"><thead><tr><th>Tema</th>' +
    matrix.profs.map(p => "<th>" + p + "</th>").join("") + "</tr></thead><tbody>";
  matrix.rows.forEach(row => {
    html += "<tr><td>" + row.label + "</td>" +
      matrix.profs.map(p => "<td>" + (row.cells[p] ? "•" : "") + "</td>").join("") + "</tr>";
  });
  html += "</tbody></table>";
  return html;
}

readWrap.innerHTML =
  DATA.header_html +
  "<h2>Cómo leer este documento</h2>" + DATA.howto_html +
  "<h2>Parte 1 — Diferenciales</h2>" + sectionHtml(DATA.part1_items, DATA.part1_extras) +
  "<h2>Parte 2 — Faltantes</h2>" + sectionHtml(DATA.part2_items, []) +
  "<h2>Matriz de cobertura temática</h2>" + DATA.matrix_intro_html +
  "<h3>" + DATA.matrix_p1.title + "</h3>" + staticMatrixHtml(DATA.matrix_p1) +
  "<h3>" + DATA.matrix_p2.title + "</h3>" + staticMatrixHtml(DATA.matrix_p2) +
  "<h2>Observaciones sobre el material</h2>" + DATA.obs_html;
</script>
